name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: e2e against api.x.ai (live if XAI_API_KEY secret is set, otherwise needs-key check)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python -m app.e2e
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact .
