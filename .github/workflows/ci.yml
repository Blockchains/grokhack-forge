name: CI
on:
  push:
    paths-ignore: ["results/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests (real index from Blockchains/grokhack-index)
        run: python3 -m unittest discover -s tests -v
      - name: Compose a chat app and a digest app (no repo creation)
        run: |
          python3 forge/compose.py --idea "A chat assistant that can look up GitHub repos and do maths with tools" --name ci-chat --out /tmp/ci-chat
          python3 forge/compose.py --idea "A daily digest of new releases across Grok integrations" --name ci-digest --out /tmp/ci-digest
      - name: Build + test the generated chat app (incl. real api.x.ai e2e)
        working-directory: /tmp/ci-chat
        env: { XAI_API_KEY: "${{ secrets.XAI_API_KEY }}" }
        run: npm install --no-audit --no-fund && npm run build && GITHUB_TOKEN=${{ github.token }} npm test && npm run e2e
      - name: Test the generated digest app (incl. real api.x.ai e2e)
        working-directory: /tmp/ci-digest
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pip install -q -r requirements.txt && pytest -q && python -m app.e2e
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact .
